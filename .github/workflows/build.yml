name: Build Windows Exe

on:
  push:
    branches: [ claude/waiter-cycling-list-app-emid8k ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WaiterTool.sln

      - name: Publish
        run: dotnet publish WaiterTool/WaiterTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Upload exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: WaiterTool-win-x64
          path: publish/
