name: Build Android APK

on:
  push:
    branches: [ claude/waiter-cycling-list-app-emid8k ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore WaiterTool.Mobile/WaiterTool.Mobile.csproj

      - name: Build APK
        run: dotnet build WaiterTool.Mobile/WaiterTool.Mobile.csproj -f net10.0-android -c Debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WaiterTool-android-apk
          path: WaiterTool.Mobile/bin/Debug/net10.0-android/*-Signed.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: WaiterTool-android-apk
          path: apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$(find "$GITHUB_WORKSPACE/apk" -name "*-Signed.apk" | head -n 1)"
            adb logcat -c
            adb shell monkey -p com.waitertool.mobile -c android.intent.category.LAUNCHER 1
            sleep 10
            adb logcat -d > "$GITHUB_WORKSPACE/logcat_full.txt"
            echo "===== Crash-relevant logcat lines ====="
            grep -E "AndroidRuntime|FATAL EXCEPTION|Unhandled exception|System\.|Mono\.Android|Backtrace|waitertool" "$GITHUB_WORKSPACE/logcat_full.txt" || echo "No obvious crash markers found"

      - name: Upload full logcat
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-logcat
          path: logcat_full.txt
