name: Build Android APK

on:
  push:
    branches: [ claude/waiter-cycling-list-app-emid8k ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore WaiterTool.Mobile/WaiterTool.Mobile.csproj

      - name: Build APK
        run: dotnet build WaiterTool.Mobile/WaiterTool.Mobile.csproj -f net8.0-android -c Debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WaiterTool-android-apk
          path: WaiterTool.Mobile/bin/Debug/net8.0-android/*.apk
